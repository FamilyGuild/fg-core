[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fg-core"
version = "0.1.0"
description = "Thin FamilyGuild foundation app."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbzero-pro>=0.6.0",
    "dbzero-modelkit>=1.2",
    "nicegui>=3.17,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["fg_core*", "web_ui*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
