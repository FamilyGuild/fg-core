[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fg-core"
version = "0.1.0"
description = "Thin FamilyGuild foundation app."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbzero-pro>=0.6.0",
    "dbzero-modelkit>=1.2,
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["fg_core*"]
